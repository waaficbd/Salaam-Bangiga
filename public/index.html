<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaam Bank - Xisaabiyaha Maalgelinta</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0066b2; /* Salaam Bank Logo Blue */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333333;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background-color: #005291; /* Darker Blue Header */
            padding: 20px 20px 45px;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .card {
            background: #ffffff; /* Clean White Card */
            width: 92%;
            max-width: 450px;
            margin-top: -25px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            color: #0066b2;
            margin: 0 0 5px;
            text-align: center;
            font-weight: 700;
        }

        .subtext {
            font-size: 13px;
            color: #666666;
            text-align: center;
            margin-bottom: 30px;
        }

        .slider-section { 
            margin-bottom: 25px; 
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            color: #444444;
        }

        .brand-text { 
            color: #008744; /* Salaam Bank Logo Green */
            font-weight: bold; 
            font-size: 16px;
        }

        input[type=range] {
            width: 100%;
            accent-color: #008744; /* Logo Green Accent */
            margin: 15px 0;
            height: 6px;
            cursor: pointer;
        }

        .slider-footer {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888888;
        }

        .result-container {
            background: #f4f8fb;
            border: 1px solid #e1ecf4;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 25px 0;
        }

        .result-value {
            color: #0066b2;
            font-size: 32px;
            font-weight: bold;
            margin: 5px 0 0;
        }

        .btn-apply {
            background-color: #008744; /* Salaam Bank Logo Green */
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-apply:hover {
            background-color: #006e37;
        }

        .btn-apply:active {
            background-color: #00542a;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin: 30px 0;
        }
    </style>
</head>

<body>

<div class="app-header">
    <span>Salaam Bank</span>
    <span>☰</span>
</div>

<div class="card">
    <h2>Xisaabiyaha Maalgelinta</h2>
    <div class="subtext">Ansixin degdeg ah • Waafaqsan Shariicada • Muddo dabacsan</div>

    <div class="slider-section">
        <div class="slider-header">
            <span>Qaddarka Maalgelinta</span>
            <span id="valAmt" class="brand-text">$1,000</span>
        </div>
        <input type="range" id="amt" min="100" max="5000" step="100" value="1000">
        <div class="slider-footer"><span>$100</span><span>$5,000</span></div>
    </div>

    <div class="slider-section">
        <div class="slider-header">
            <span>Muddada Bixinta</span>
            <span id="valDur" class="brand-text">12 bilood</span>
        </div>
        <input type="range" id="dur" min="6" max="60" step="6" value="12">
        <div class="slider-footer"><span>6 bilood</span><span>60 bilood</span></div>
    </div>

    <div class="result-container">
        <p style="margin:0; font-size:14px; color:#666666">Lacagta Bishiiba Bixinaysid</p>
        <p id="monthly" class="result-value">$98.33</p>
    </div>

    <button class="btn-apply" onclick="goToPage2()">CODSO HADDA</button>
</div>

<div class="footer">© 2026 Salaam Bank Somalia. Hantida oo dhan waa la dhowray.</div>

<script>
    function update() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        const amount = Number(amtEl.value) || 0;
        const duration = Number(durEl.value) || 1;

        document.getElementById('valAmt').innerText = `$${amount.toLocaleString()}`;
        document.getElementById('valDur').innerText = `${duration} bilood`;

        const monthly = (amount * 1.18) / duration;
        document.getElementById('monthly').innerText = `$${monthly.toFixed(2)}`;
    }

    function goToPage2() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        localStorage.setItem('amount', amtEl.value);
        localStorage.setItem('loanDuration', durEl.value + " Bilood");

        window.location.href = "/page2";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (amtEl) amtEl.addEventListener('input', update);
        if (durEl) durEl.addEventListener('input', update);

        update();
    };
</script>

</body>
</html>
